name: Backend CI

on:
  push:
    paths:
      - "backend/taxisphere-api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/taxisphere-api/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        working-directory: backend/taxisphere-api
        run: mvn test
