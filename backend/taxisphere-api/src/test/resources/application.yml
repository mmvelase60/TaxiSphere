spring:
  datasource:
    url: jdbc:h2:mem:taxisphere_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

taxisphere:
  platform:
    name: TaxiSphere Enterprise Mobility Platform
    version: 0.1.0-test
  security:
    bootstrap-admin:
      username: platform-admin
      password: change-me
    jwt:
      issuer: TaxiSphere
      secret: test-secret-must-be-at-least-32-bytes-long
      access-token-minutes: 30
  identity:
    bootstrap:
      enabled: false
      email:
      password:
