spring:
  application:
    name: taxisphere-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:taxisphere;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

taxisphere:
  platform:
    name: TaxiSphere Enterprise Mobility Platform
    version: 0.1.0
  security:
    bootstrap-admin:
      username: ${TAXISPHERE_BOOTSTRAP_ADMIN_USERNAME:platform-admin}
      password: ${TAXISPHERE_BOOTSTRAP_ADMIN_PASSWORD:change-me}
    jwt:
      issuer: ${TAXISPHERE_JWT_ISSUER:TaxiSphere}
      secret: ${TAXISPHERE_JWT_SECRET:local-development-secret-must-be-replaced-before-production}
      access-token-minutes: ${TAXISPHERE_JWT_ACCESS_TOKEN_MINUTES:30}
  identity:
    bootstrap:
      enabled: ${TAXISPHERE_IDENTITY_BOOTSTRAP_ENABLED:false}
      email: ${TAXISPHERE_IDENTITY_BOOTSTRAP_EMAIL:}
      password: ${TAXISPHERE_IDENTITY_BOOTSTRAP_PASSWORD:}
