spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

taxisphere:
  security:
    bootstrap-admin:
      username: ${TAXISPHERE_BOOTSTRAP_ADMIN_USERNAME}
      password: ${TAXISPHERE_BOOTSTRAP_ADMIN_PASSWORD}
    jwt:
      issuer: ${TAXISPHERE_JWT_ISSUER}
      secret: ${TAXISPHERE_JWT_SECRET}
      access-token-minutes: ${TAXISPHERE_JWT_ACCESS_TOKEN_MINUTES}
